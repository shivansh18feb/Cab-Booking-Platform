# Development Profile Configuration
# In-memory H2 database for instant zero-friction developer startup.
spring.datasource.url=jdbc:h2:mem:cabflow_dev;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# DDL and Hibernate configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=12
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Enable H2 web console for development inspection at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

logging.level.com.cab.booking=INFO
logging.level.org.springframework.security=INFO
